# Drone tracking simulation — 2D pixel-space (4K image)
# Uncomment and change any value before running ./drone_sim

# Process noise spectral density (CV model: Wiener-process velocity)
# Pixel-space: larger values needed for motion in pixels
qc_cv       = 500.0
# CA model process noise (lower — acceleration is modeled directly)
qc_ca       = 1000.0

sigma_uv    = 2.0        # Measurement noise std dev (pixels)

dt          = 0.10       # Filter step (s) — 10 Hz

total_time  = 20.0       # Simulation duration (s)
seed        = 42         # RNG seed

# Image resolution (pixels)
img_width   = 3840
img_height  = 2160

# Initial state — true state + Gaussian noise.
# Covariance diagonal = sigma² * 9 (so 3σ sigma-point spread matches sigma).
init_pos_sigma = 50.0    # Position noise std dev (pixels)
init_vel_sigma = 20.0    # Velocity noise std dev (pixels/s)

# Async prediction demo — predict ahead from a snapshot
predict_at     = 15.0   # Time (s) to snapshot the filter state
predict_ahead  = 2.0    # How many seconds to predict into the future

output_prefix = output/drone_sim_output
