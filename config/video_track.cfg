# Video tracking configuration
# Uncomment and change any value before running ./video_track

video_path      = videos/helicopter3.mp4
model_path      = videos/yolov8n.onnx
conf_threshold  = 0.5
detections_csv  = videos/helicopter3.csv  # fallback if ONNX unavailable

# Kalman filter parameters
qc_cv           = 500.0       # process-noise PSD (px²/s³)
sigma_uv        = 5.0         # measurement noise std-dev (pixels)
init_pos_sigma  = 100.0       # initial position uncertainty (pixels)
init_vel_sigma  = 50.0        # initial velocity uncertainty (px/s)

# Output
output_video    = output/video_track.mp4
show_display    = true
