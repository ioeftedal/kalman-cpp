# Video tracking configuration
# Uncomment and change any value before running ./video_track

video_path      = videos/helicopter3.mp4
model_path      = videos/yolov8n.onnx
conf_threshold  = 0.5
detections_csv  = videos/helicopter3.csv  # fallback if ONNX unavailable
detector_input_size = 640
detector_letterbox  = true

# Kalman filter parameters
qc_cv           = 200.0       # process-noise PSD (px²/s³) — reduced for smoother tracking
sigma_uv        = 8.0         # YOLO position noise std-dev (pixels) — increased to trust bad detections less
init_pos_sigma  = 100.0       # initial position uncertainty (pixels)
init_vel_sigma  = 50.0        # initial velocity uncertainty (px/s)

# Innovation gating (outlier rejection)
gate_threshold  = 9.21        # chi-squared 2-DOF @ 99% — reject measurements beyond this Mahalanobis distance
conf_noise_scale = 10.0       # measurement noise grows as (1 + conf_noise_scale * (1 - confidence))

# KLT optical flow parameters
sigma_klv       = 10.0        # KLT velocity noise std-dev (px/s) — reduced to trust good KLT more
occ_noise_rate  = 50.0        # occlusion noise inflation rate (px²/s)
klt_min_features= 4           # minimum features for valid KLT measurement

# IMM mode-mixing
imm_transition_p = 0.02
imm_q_mul_cv    = 1.0
imm_q_mul_ca    = 2.0
imm_q_mul_ct    = 1.25

# Camera-motion compensation and adaptive measurement noise
global_motion   = true
adapt_noise     = true
adapt_window    = 30

# Appearance memory (template NCC reacquisition during detector dropout)
appearance          = true
appearance_min_ncc  = 0.78       # min TM_CCOEFF_NORMED peak to accept a match
appearance_min_psr  = 3.0        # min peak-to-sidelobe ratio to accept a match
appearance_update_rate = 0.15
sigma_app           = 12.0       # appearance position noise std-dev (pixels)
appearance_gate     = 20.0       # looser IMM Mahalanobis gate for reacquisitions

# Output
output_video    = output/video_track.mp4
show_display    = true